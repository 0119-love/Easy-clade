<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 16px;
        background: #0f1415;
        color: #f8fafa;
        font-family: system-ui, -apple-system, sans-serif;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 14px;
        font-weight: 600;
      }
      button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 10px;
        background: #f8fafa;
        color: #0f1415;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        line-height: 1.4;
        color: #8a9592;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>AI Command Center</h1>
    <button id="connect">Connect</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
